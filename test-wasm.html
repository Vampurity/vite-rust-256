<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAssembly 测试</title>
  </head>
  <body>
    <h1>WebAssembly 模块测试</h1>
    <div id="output"></div>

    <script type="module">
      import init, { encrypt_string, decrypt_string, generate_key } from './pkg/vue_rust_crypto.js'

      async function test() {
        const output = document.getElementById('output')

        try {
          // 初始化 WebAssembly 模块
          await init()
          output.innerHTML += '<p>✅ WebAssembly 模块加载成功！</p>'

          // 测试密钥生成
          const key = generate_key(16)
          output.innerHTML += `<p>🔑 生成的密钥: ${key}</p>`

          // 测试加密
          const originalText = 'Hello, WebAssembly!'
          const encrypted = encrypt_string(originalText, key)
          output.innerHTML += `<p>🔒 原始文本: ${originalText}</p>`
          output.innerHTML += `<p>🔒 加密结果: ${encrypted}</p>`

          // 测试解密
          const decrypted = decrypt_string(encrypted, key)
          output.innerHTML += `<p>🔓 解密结果: ${decrypted}</p>`

          // 验证结果
          if (originalText === decrypted) {
            output.innerHTML += '<p>✅ 加密解密测试成功！</p>'
          } else {
            output.innerHTML += '<p>❌ 加密解密测试失败！</p>'
          }
        } catch (error) {
          output.innerHTML += `<p>❌ 错误: ${error.message}</p>`
          console.error('测试失败:', error)
        }
      }

      test()
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简单测试</title>
  </head>
  <body>
    <h1>简单测试</h1>
    <button id="testBtn">测试随机密钥生成</button>
    <div id="output"></div>

    <script type="module">
      import init, { generate_key } from './pkg/vue_rust_crypto.js'

      let isLoaded = false
      const output = document.getElementById('output')
      const testBtn = document.getElementById('testBtn')

      async function loadModule() {
        try {
          await init()
          isLoaded = true
          output.innerHTML = '✅ WebAssembly 模块加载成功！'
          testBtn.disabled = false
        } catch (error) {
          output.innerHTML = `❌ 加载失败: ${error.message}`
          console.error('加载失败:', error)
        }
      }

      function testKeyGeneration() {
        if (!isLoaded) {
          output.innerHTML = '模块未加载'
          return
        }

        try {
          const key = generate_key(16)
          output.innerHTML = `✅ 生成的密钥: ${key} (长度: ${key.length})`
          console.log('密钥生成成功:', key)
        } catch (error) {
          output.innerHTML = `❌ 密钥生成失败: ${error.message}`
          console.error('密钥生成失败:', error)
        }
      }

      testBtn.addEventListener('click', testKeyGeneration)
      loadModule()
    </script>
  </body>
</html>
